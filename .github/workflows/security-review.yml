name: Security Review

# Runs an extra, security-focused Claude review when a pull request touches security-sensitive code.
# What counts as sensitive lives in scripts/ci/security-scope.ts (mirrored in AGENTS.md).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect security scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      required: ${{ steps.scope.outputs.required }}
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect security-sensitive changes
        id: scope
        # Use the base branch's copy of the detector so a PR cannot switch off its own review.
        # (Changing the detector itself always counts as security-sensitive.)
        run: |
          git show "origin/$BASE_REF:scripts/ci/security-scope.ts" > "$RUNNER_TEMP/security-scope.ts" 2>/dev/null \
            || cp scripts/ci/security-scope.ts "$RUNNER_TEMP/security-scope.ts"
          node --no-warnings "$RUNNER_TEMP/security-scope.ts" "$BASE_SHA" "$HEAD_SHA"

      - name: Label pull request
        if: steps.scope.outputs.required == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create security-review --color B60205 \
            --description "Touches security-sensitive code; extra security review required" --force
          gh pr edit "$PR" --add-label security-review

  review:
    name: Claude security review
    needs: detect
    # Secrets are not available to PRs from forks; skip drafts until they are ready.
    if: >-
      needs.detect.outputs.required == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build review prompt
        id: prompt
        # Take the review instructions and the detector from the base branch, so the PR under review
        # cannot rewrite them. Fall back to the PR's copy when the base does not have them yet.
        run: |
          git show "origin/$BASE_REF:.github/prompts/security-review.md" > "$RUNNER_TEMP/security-review.md" 2>/dev/null \
            || cp .github/prompts/security-review.md "$RUNNER_TEMP/security-review.md"
          git show "origin/$BASE_REF:scripts/ci/security-scope.ts" > "$RUNNER_TEMP/security-scope.ts" 2>/dev/null \
            || cp scripts/ci/security-scope.ts "$RUNNER_TEMP/security-scope.ts"
          {
            echo "text<<PROMPT_EOF"
            echo "Pull request: #${{ github.event.pull_request.number }} in ${{ github.repository }}."
            echo
            env -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY node --no-warnings "$RUNNER_TEMP/security-scope.ts" "$BASE_SHA" "$HEAD_SHA" | grep -v '^PROMPT_EOF$'
            echo
            cat "$RUNNER_TEMP/security-review.md"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude security review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Write(/tmp/security-review.md),mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
